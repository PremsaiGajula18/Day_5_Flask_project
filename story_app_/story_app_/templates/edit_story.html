{% extends "base.html" %} {% block title %}Edit story | Story App{% endblock %}
{% block content %}
<h1>Edit story</h1>
{% if error %}
<p class="error" role="alert">{{ error }}</p>
{% endif %}
<form method="post">
  <p>
    <label
      >Title <input name="title" required value="{{ form['title'] }}"
    /></label>
  </p>
  <p>
    <label
      >Author <input name="author" required value="{{ form['author'] }}"
    /></label>
  </p>
  <p>
    <label
      >Story
      <textarea name="story" rows="8" required>{{ form['story'] }}</textarea>
    </label>
  </p>
  <button type="submit">Update story</button>
</form>
{% endblock %}

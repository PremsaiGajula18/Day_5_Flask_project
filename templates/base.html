<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Student registration{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="page-wrapper">
        <!-- Top Navigation matching the screenshot -->
        <nav class="top-nav">
            <a href="{{ url_for('users_page') }}">All students</a>
            <span class="nav-separator">·</span>
            <a href="{{ url_for('register_page') }}">Register</a>
        </nav>

        <!-- Main Content Area -->
        <main class="main-card">
            {% block content %}
            {% endblock %}
        </main>
    </div>

    {% block scripts %}
    {% endblock %}

</body>
</html>
